<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none" class="brand-logo-svg">
  <!-- Valley Center Pivot Radial Emblem -->
  <g transform="translate(10, 6)">
    <!-- Base tower circle -->
    <circle cx="24" cy="24" r="21" stroke="#111827" stroke-width="3.5" fill="none"/>
    <!-- Pivot arm radial rays -->
    <line x1="24" y1="24" x2="24" y2="7" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="24" x2="39" y2="15" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="24" x2="39" y2="33" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="24" x2="9" y2="33" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="24" x2="9" y2="15" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="4.5" fill="#111827"/>
  </g>
  <!-- Valley Wordmark -->
  <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="1.5" fill="#111827">VALLEY</text>
  <text x="69" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="2" fill="#4b5563">PRECISION IRRIGATION</text>
</svg>
